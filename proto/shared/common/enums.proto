syntax = "proto3";

package shared.common;

// Role enumeration
enum RoleEnum {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN       = 1;
  ROLE_USER        = 2;
}

// Status enumeration
enum StatusEnum {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE      = 1;
  STATUS_INACTIVE    = 2;
}

// Product status enumeration
enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED  = 0;
  PRODUCT_STATUS_NEW          = 1;
  PRODUCT_STATUS_ACTIVE       = 2;
  PRODUCT_STATUS_DISCONTINUED = 3;
  PRODUCT_STATUS_OUT_OF_STOCK = 4;
  PRODUCT_STATUS_INACTIVE     = 5;
}

// Product brand status enumeration
enum ProductBrandStatus {
  PRODUCT_BRAND_STATUS_UNSPECIFIED = 0;
  PRODUCT_BRAND_STATUS_ACTIVE      = 1;
  PRODUCT_BRAND_STATUS_INACTIVE    = 2;
}

// Product category status enumeration
enum ProductCategoryStatus {
  PRODUCT_CATEGORY_STATUS_UNSPECIFIED = 0;
  PRODUCT_CATEGORY_STATUS_ACTIVE      = 1;
  PRODUCT_CATEGORY_STATUS_INACTIVE    = 2;
}

// Auth provider enumeration
enum AuthProvider {
  AUTH_PROVIDER_UNSPECIFIED = 0;
  AUTH_PROVIDER_EMAIL       = 1;
  AUTH_PROVIDER_PHONE       = 2;
  AUTH_PROVIDER_FACEBOOK    = 3;
  AUTH_PROVIDER_GOOGLE      = 4;
  AUTH_PROVIDER_ZALO        = 5;
}

// Audit log status enumeration
enum AuditLogStatus {
  AUDIT_LOG_STATUS_UNSPECIFIED = 0;
  AUDIT_LOG_STATUS_SUCCESS     = 1;
  AUDIT_LOG_STATUS_FAILURE     = 2;
}

// Affiliate type enumeration
enum AffiliateType {
  AFFILIATE_TYPE_UNSPECIFIED = 0;
  AFFILIATE_TYPE_KOL         = 1;
  AFFILIATE_TYPE_CTV         = 2;
  AFFILIATE_TYPE_PUBLISHER   = 3;
}

// Affiliate status enumeration
enum AffiliateStatus {
  AFFILIATE_STATUS_UNSPECIFIED = 0;
  AFFILIATE_STATUS_ACTIVE      = 1;
  AFFILIATE_STATUS_INACTIVE    = 2;
}

// Job type enumeration
enum JobType {
  JOB_TYPE_UNSPECIFIED                   = 0;
  JOB_TYPE_NHANH_PRODUCT_LIST_SYNC       = 1;  // Step 1;
  JOB_TYPE_NHANH_CATEGORY_SYNC           = 2;
  JOB_TYPE_NHANH_INVENTORY_SYNC          = 3;
  JOB_TYPE_NHANH_BRAND_SYNC              = 4;
  JOB_TYPE_NHANH_DEPOT_SYNC              = 5;
  JOB_TYPE_NHANH_PRODUCT_DETAIL_SYNC     = 6;  // Step 2;
  JOB_TYPE_NHANH_PRODUCT_EMBED_SYNC      = 7;  // Step 3;
  JOB_TYPE_COMMISSION_RATE_RECALCULATION = 8;
}

// Job status enumeration
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING     = 1;
  JOB_STATUS_RUNNING     = 2;
  JOB_STATUS_COMPLETED   = 3;
  JOB_STATUS_FAILED      = 4;
  JOB_STATUS_CANCELLED   = 5;
}

// Combo status enumeration
enum ComboStatus {
  COMBO_STATUS_UNSPECIFIED = 0;
  COMBO_STATUS_ACTIVE      = 1;
  COMBO_STATUS_INACTIVE    = 2;
}

// Discount type enumeration (for combos, coupons, promotions)
enum DiscountType {
  DISCOUNT_TYPE_UNSPECIFIED = 0;
  DISCOUNT_TYPE_FIXED       = 1; // Fixed amount discount
  DISCOUNT_TYPE_PERCENTAGE  = 2; // Percentage discount
}

// Discount detail type enumeration (for order discount breakdown)
enum DiscountDetailType {
  DISCOUNT_DETAIL_TYPE_UNSPECIFIED      = 0;
  DISCOUNT_DETAIL_TYPE_COMBO            = 1;
  DISCOUNT_DETAIL_TYPE_FLASH_SALE       = 2;
  DISCOUNT_DETAIL_TYPE_COUPON           = 3; // Voucher (CDP or CMS Product Discount Voucher)
  DISCOUNT_DETAIL_TYPE_PRODUCT_DISCOUNT = 4; // CTKM AUTO_APPLY
}

// Flash sale status enumeration (computed from time + isEnabled)
enum FlashSaleStatus {
  FLASH_SALE_STATUS_UNSPECIFIED = 0;
  FLASH_SALE_STATUS_ACTIVE      = 1; // Within time range and enabled
  FLASH_SALE_STATUS_UPCOMING    = 2; // Before start time
  FLASH_SALE_STATUS_ENDED       = 3; // After end time
  FLASH_SALE_STATUS_DISABLED    = 4; // Manually disabled
}

// Topic type enumeration
enum TopicType {
  TOPIC_TYPE_UNSPECIFIED = 0;
  TOPIC_TYPE_PRODUCT     = 1;
  TOPIC_TYPE_CATEGORY    = 2;
  TOPIC_TYPE_BANNER      = 3; // Topic displays banner slides
}

// Topic status enumeration
enum TopicStatus {
  TOPIC_STATUS_UNSPECIFIED = 0;
  TOPIC_STATUS_ACTIVE      = 1;
  TOPIC_STATUS_INACTIVE    = 2;
}

// Menu status enumeration
enum MenuStatus {
  MENU_STATUS_UNSPECIFIED = 0;
  MENU_STATUS_ACTIVE      = 1;
  MENU_STATUS_INACTIVE    = 2;
}

// Menu type enumeration
enum MenuType {
  MENU_TYPE_UNSPECIFIED = 0;
  MENU_TYPE_CATEGORY    = 1; // Links to a product category
  MENU_TYPE_TOPIC       = 2; // Links to a topic
  MENU_TYPE_URL         = 3; // Custom URL
}

// Checkout session status enumeration
enum CheckoutSessionStatus {
  CHECKOUT_SESSION_STATUS_UNSPECIFIED     = 0;
  CHECKOUT_SESSION_STATUS_ACTIVE          = 1; // Session is active and can be modified
  CHECKOUT_SESSION_STATUS_PENDING_PAYMENT = 2; // Waiting for online payment confirmation
  CHECKOUT_SESSION_STATUS_COMPLETED       = 3; // Session converted to order (terminal)
  CHECKOUT_SESSION_STATUS_FAILED          = 4; // Payment failed
  CHECKOUT_SESSION_STATUS_EXPIRED         = 5; // Session expired without completing (terminal)
}

// Item validation error type enumeration
enum ItemValidationErrorType {
  ITEM_VALIDATION_ERROR_TYPE_UNSPECIFIED        = 0;
  ITEM_VALIDATION_ERROR_TYPE_UNAVAILABLE        = 1;
  ITEM_VALIDATION_ERROR_TYPE_INSUFFICIENT_STOCK = 2;
  ITEM_VALIDATION_ERROR_TYPE_FLASH_SALE_ENDED   = 3;
  ITEM_VALIDATION_ERROR_TYPE_COMBO_INVALID      = 4;
}

// Promotion type enumeration
enum PromotionType {
  PROMOTION_TYPE_UNSPECIFIED      = 0;
  PROMOTION_TYPE_BUNDLE_DEAL      = 1; // Mua kèm deal sốc
  PROMOTION_TYPE_ORDER_DISCOUNT   = 2; // Giảm giá hóa đơn
  PROMOTION_TYPE_PRODUCT_COMBO    = 3; // Combo khuyến mãi
  PROMOTION_TYPE_PRODUCT_DISCOUNT = 4; // Giảm giá sản phẩm
}

// Promotion status enumeration (computed from time + isEnabled)
enum PromotionStatus {
  PROMOTION_STATUS_UNSPECIFIED = 0;
  PROMOTION_STATUS_ACTIVE      = 1; // Within time range and enabled
  PROMOTION_STATUS_UPCOMING    = 2; // Before start time
  PROMOTION_STATUS_ENDED       = 3; // After end time
  PROMOTION_STATUS_PAUSED      = 4; // Manually paused
}

// Bundle deal sub-type enumeration
enum BundleDealSubType {
  BUNDLE_DEAL_SUB_TYPE_UNSPECIFIED     = 0;
  BUNDLE_DEAL_SUB_TYPE_BUY_TO_GET_GIFT = 1; // Mua để nhận quà
  BUNDLE_DEAL_SUB_TYPE_BUY_X_GET_Y     = 2; // Mua X tặng Y
}

// Order discount sub-type enumeration
enum OrderDiscountSubType {
  ORDER_DISCOUNT_SUB_TYPE_UNSPECIFIED = 0;
  ORDER_DISCOUNT_SUB_TYPE_AUTO_APPLY  = 1; // Tự động áp dụng khi đủ điều kiện
  ORDER_DISCOUNT_SUB_TYPE_PROMO_CODE  = 2; // Cần nhập mã khuyến mãi
}

// Product discount sub-type enumeration
enum ProductDiscountSubType {
  PRODUCT_DISCOUNT_SUB_TYPE_UNSPECIFIED = 0;
  PRODUCT_DISCOUNT_SUB_TYPE_AUTO_APPLY  = 1; // Chương trình khuyến mại (tự động áp dụng)
  PRODUCT_DISCOUNT_SUB_TYPE_VOUCHER     = 2; // Mã voucher
}

// Banner position enumeration
enum BannerPosition {
  BANNER_POSITION_UNSPECIFIED = 0;
  BANNER_POSITION_HERO_SLIDER = 1; // Main hero slider at top of homepage
  BANNER_POSITION_AD_SECTION  = 2; // Advertisement section on homepage
}

// Banner media type enumeration
enum BannerMediaType {
  BANNER_MEDIA_TYPE_UNSPECIFIED = 0;
  BANNER_MEDIA_TYPE_IMAGE       = 1; // Banner contains images
  BANNER_MEDIA_TYPE_VIDEO       = 2; // Banner contains videos
}

// Product badge enumeration (CMS-only promotional badges)
enum ProductBadge {
  PRODUCT_BADGE_UNSPECIFIED    = 0;
  PRODUCT_BADGE_SALE           = 1; // Product is on sale
  PRODUCT_BADGE_NEW            = 2; // Product is new
  PRODUCT_BADGE_HOT            = 3; // Product is popular/trending
  PRODUCT_BADGE_BEST_SELLER    = 4; // Product is a best seller
  PRODUCT_BADGE_CLEARANCE_SALE = 5; // Product is on clearance sale
}

// Product banner position enumeration (overlay position on product images)
enum ProductBannerPosition {
  PRODUCT_BANNER_POSITION_UNSPECIFIED = 0;
  PRODUCT_BANNER_POSITION_TOP         = 1; // Banner overlays at top of product image
  PRODUCT_BANNER_POSITION_BOTTOM      = 2; // Banner overlays at bottom of product image
}

// Shipping fee calculation method enumeration
enum ShippingFeeMethod {
  SHIPPING_FEE_METHOD_UNSPECIFIED    = 0;
  SHIPPING_FEE_METHOD_FLAT_RATE      = 1; // Fixed fee for all orders
  SHIPPING_FEE_METHOD_FREE_THRESHOLD = 2; // Free shipping when order exceeds threshold
  SHIPPING_FEE_METHOD_WEIGHT_BASED   = 3; // Fee based on product weight
  SHIPPING_FEE_METHOD_LOCATION_BASED = 4; // Fee varies by delivery location
  SHIPPING_FEE_METHOD_TIERED         = 5; // Fee tiers based on order value
  SHIPPING_FEE_METHOD_CARRIER_BASED  = 6; // Real-time carrier rates (e.g., Nhanh.vn)
}

// Shipping fee config status enumeration (computed from time + isActive)
enum ShippingFeeConfigStatus {
  SHIPPING_FEE_CONFIG_STATUS_UNSPECIFIED = 0;
  SHIPPING_FEE_CONFIG_STATUS_ACTIVE      = 1; // Currently active
  SHIPPING_FEE_CONFIG_STATUS_UPCOMING    = 2; // Scheduled for future
  SHIPPING_FEE_CONFIG_STATUS_ENDED       = 3; // Past end time
  SHIPPING_FEE_CONFIG_STATUS_INACTIVE    = 4; // Manually deactivated
}

// Shipping promotion type enumeration
enum ShippingPromotionType {
  SHIPPING_PROMOTION_TYPE_UNSPECIFIED       = 0;
  SHIPPING_PROMOTION_TYPE_FREESHIP          = 1; // Free shipping when order meets threshold
  SHIPPING_PROMOTION_TYPE_SHIPPING_DISCOUNT = 2; // Discount applied to shipping fee
}

// Shipping promotion status enumeration (computed from time + isEnabled)
enum ShippingPromotionStatus {
  SHIPPING_PROMOTION_STATUS_UNSPECIFIED = 0;
  SHIPPING_PROMOTION_STATUS_ACTIVE      = 1; // Within time range and enabled
  SHIPPING_PROMOTION_STATUS_UPCOMING    = 2; // Before start time
  SHIPPING_PROMOTION_STATUS_ENDED       = 3; // After end time
  SHIPPING_PROMOTION_STATUS_DISABLED    = 4; // Manually disabled
}

// Push notification status enumeration
enum PushNotificationStatus {
  PUSH_NOTIFICATION_STATUS_UNSPECIFIED = 0;
  PUSH_NOTIFICATION_STATUS_DRAFT       = 1; // Draft, editable
  PUSH_NOTIFICATION_STATUS_PENDING     = 2; // Scheduled, waiting to send
  PUSH_NOTIFICATION_STATUS_SENT        = 3; // Successfully sent
  PUSH_NOTIFICATION_STATUS_RECALLED    = 4; // Recalled after sending
}

// Push notification category enumeration
enum PushNotificationCategory {
  PUSH_NOTIFICATION_CATEGORY_UNSPECIFIED = 0;
  PUSH_NOTIFICATION_CATEGORY_NEWS        = 1; // News/general notification
  PUSH_NOTIFICATION_CATEGORY_PROMOTION   = 2; // Promotional notification
}

// Withdrawal request status enumeration
enum WithdrawalRequestStatus {
  WITHDRAWAL_REQUEST_STATUS_UNSPECIFIED = 0;
  WITHDRAWAL_REQUEST_STATUS_PENDING     = 1; // Chờ duyệt
  WITHDRAWAL_REQUEST_STATUS_APPROVED    = 2; // Chờ chi trả
  WITHDRAWAL_REQUEST_STATUS_PAID        = 3; // Đã chi trả
  WITHDRAWAL_REQUEST_STATUS_REJECTED    = 4; // Từ chối
}
