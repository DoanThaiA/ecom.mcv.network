syntax = "proto3";

package shared.combos;

import "shared/common/enums.proto";
import "shared/common/localization.proto";
import "google/protobuf/timestamp.proto";

// Combo item - a product reference within a combo
message ComboItem {
  string product_id = 1;
  int32  quantity   = 2;
}

// Combo item with product details (for response)
message ComboItemResponse {
  string          product_id    = 1;
  int32           quantity      = 2;
  optional string product_name  = 3;
  optional string product_image = 4;
  optional double product_price = 5;
}

// Combo domain entity
message Combo {
  string                              id                = 1;
  string                              name              = 2;
  optional string                     description       = 3;
  optional string                     image             = 4;
  repeated ComboItem                  items             = 5;
  shared.common.DiscountType          discount_type     = 6;
  double                              discount_value    = 7;
  double                              original_price    = 8;
  shared.common.ComboStatus           status            = 9;
  optional google.protobuf.Timestamp  valid_from        = 10;
  optional google.protobuf.Timestamp  valid_to          = 11;
  google.protobuf.Timestamp           created_at        = 12;
  google.protobuf.Timestamp           updated_at        = 13;
  optional google.protobuf.Timestamp  deleted_at        = 14;
  optional shared.common.Localization name_localization = 15;
}

// Combo response with enriched items (for API responses)
message ComboResponse { 
  string                              id                = 1;
  string                              name              = 2;
  optional string                     description       = 3;
  optional string                     image             = 4;
  repeated ComboItemResponse          items             = 5;
  shared.common.DiscountType          discount_type     = 6;
  double                              discount_value    = 7;
  double                              original_price    = 8;
  double                              final_price       = 9; // Calculated: originalPrice - discountAmount
  double                              discount_amount   = 10; // Calculated discount amount
  shared.common.ComboStatus           status            = 11;
  optional google.protobuf.Timestamp  valid_from        = 12;
  optional google.protobuf.Timestamp  valid_to          = 13;
  google.protobuf.Timestamp           created_at        = 14;
  google.protobuf.Timestamp           updated_at        = 15;
  optional google.protobuf.Timestamp  deleted_at        = 16;
  optional shared.common.Localization name_localization = 17;
}
