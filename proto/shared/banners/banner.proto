syntax = "proto3";

package shared.banners;

import "shared/common/enums.proto";
import "google/protobuf/timestamp.proto";

// Responsive media URLs for different device types (images or videos)
message ResponsiveMedia {
  string mobile  = 1; // Media URL for mobile devices (<768px)
  string tablet  = 2; // Media URL for tablet devices (768px - 1023px)
  string desktop = 3; // Media URL for desktop devices (>=1024px)
}

// Banner domain entity
message Banner {
  string                             id         = 1;
  shared.common.BannerPosition       position   = 2; // HERO_SLIDER or AD_SECTION
  shared.common.BannerMediaType      media_type = 3; // IMAGE or VIDEO
  ResponsiveMedia                    media      = 4; // Responsive media URLs
  optional string                    link       = 5;  // Optional URL link
  int32                              order      = 6; // Display order (lower = displayed first)
  bool                               is_active  = 7; // Active/Inactive status
  google.protobuf.Timestamp          created_at = 8;
  google.protobuf.Timestamp          updated_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10;
}

// Banner list item (for list views)
message BannerListItem {
  string                        id         = 1;
  shared.common.BannerPosition  position   = 2;
  shared.common.BannerMediaType media_type = 3;
  ResponsiveMedia               media      = 4;
  optional string               link       = 5;
  int32                         order      = 6;
  bool                          is_active  = 7;
  google.protobuf.Timestamp     created_at = 8;
  google.protobuf.Timestamp     updated_at = 9;
}
