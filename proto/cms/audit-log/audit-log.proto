syntax = "proto3";

package cms.audit_log;

import "shared/common/enums.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// User type for audit log
enum AuditLogUserType {
  AUDIT_LOG_USER_TYPE_UNSPECIFIED = 0;
  AUDIT_LOG_USER_TYPE_CMS         = 1;
  AUDIT_LOG_USER_TYPE_SYSTEM      = 2;
}

// Audit log error details
message AuditLogError {
  string          message = 1;
  optional string name    = 2;
  optional string stack   = 3;
}

// Audit log domain entity
message AuditLog {
  string                          id          = 1;
  string                          action      = 2;
  optional string                 category    = 3;
  optional string                 description = 4;
  optional string                 user_id     = 5;
  optional string                 user_email  = 6;
  AuditLogUserType                user_type   = 7;
  shared.common.AuditLogStatus    status      = 8;
  optional string                 http_method = 9;
  optional string                 endpoint    = 10;
  optional string                 ip_address  = 11;
  optional string                 user_agent  = 12;
  optional string                 request_id  = 13;
  optional google.protobuf.Struct input       = 14;
  optional google.protobuf.Struct output      = 15;
  optional AuditLogError          error       = 16;
  optional int32                  duration_ms = 17;
  optional google.protobuf.Struct metadata    = 18;
  google.protobuf.Timestamp       created_at  = 19;
}

// Filter audit log DTO
message FilterAuditLog {
  optional string                       search     = 1;
  optional string                       action     = 2;
  optional string                       category   = 3;
  optional string                       user_id    = 4;
  optional AuditLogUserType             user_type  = 5;
  optional shared.common.AuditLogStatus status     = 6;
  optional google.protobuf.Timestamp    start_date = 7;
  optional google.protobuf.Timestamp    end_date   = 8;
}

// Query audit log DTO
message QueryAuditLog {
  optional int32          page    = 1;
  optional int32          limit   = 2;
  optional FilterAuditLog filters = 3;
}
