syntax = "proto3";

package cms.shipping;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "shared/common/enums.proto";
import "shared/shipping/shipping-promotion.proto";

// ==================== Create/Update DTOs ====================

// Create shipping promotion request
message CreateShippingPromotionRequest {
  shared.common.ShippingPromotionType type       = 1;
  string                              name       = 2;
  google.protobuf.Timestamp           start_time = 3;
  google.protobuf.Timestamp           end_time   = 4;

  oneof config {
    shared.shipping.FreeshippingConfig     freeshipping_config      = 10;
    shared.shipping.ShippingDiscountConfig shipping_discount_config = 11;
  }
}

// Update shipping promotion request
message UpdateShippingPromotionRequest {
  string                             id         = 1;
  optional string                    name       = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time   = 4;
  optional bool                      is_enabled = 5;

  oneof config {
    shared.shipping.FreeshippingConfig     freeshipping_config      = 10;
    shared.shipping.ShippingDiscountConfig shipping_discount_config = 11;
  }
}

// ==================== Query DTOs ====================

// Filter shipping promotions
message FilterShippingPromotion {
  optional string                                search = 1; // Search by name
  optional shared.common.ShippingPromotionType   type   = 2; // Filter by type
  optional shared.common.ShippingPromotionStatus status = 3; // Filter by computed status
}

// Sort shipping promotions
message SortShippingPromotion {
  string order_by = 1; // 'createdAt' | 'name' | 'startTime' | 'endTime'
  string order    = 2; // 'asc' | 'desc'
}

// Query shipping promotions request
message QueryShippingPromotionsRequest {
  optional int32                   page    = 1;
  optional int32                   limit   = 2;
  optional FilterShippingPromotion filters = 3;
  repeated SortShippingPromotion   sort    = 4;
}

// Query shipping promotions response (paginated)
message QueryShippingPromotionsResponse {
  repeated shared.shipping.ShippingPromotionListItem data          = 1;
  bool                                               has_next_page = 2;
  int32                                              total         = 3;
  int32                                              page          = 4;
  int32                                              limit         = 5;
  int32                                              total_pages   = 6;
}

// ==================== Single Item Operations ====================

message GetShippingPromotionRequest { string id = 1; }

message DeleteShippingPromotionRequest { string id = 1; }

message ToggleShippingPromotionRequest { string id = 1; }

// ==================== Service Definition ====================

service ShippingPromotionService {
  rpc CreateShippingPromotion(CreateShippingPromotionRequest) returns (shared.shipping.ShippingPromotion);
  rpc GetShippingPromotion(GetShippingPromotionRequest) returns (shared.shipping.ShippingPromotion);
  rpc QueryShippingPromotions(QueryShippingPromotionsRequest) returns (QueryShippingPromotionsResponse);
  rpc UpdateShippingPromotion(UpdateShippingPromotionRequest) returns (shared.shipping.ShippingPromotion);
  rpc DeleteShippingPromotion(DeleteShippingPromotionRequest) returns (google.protobuf.Empty);
  rpc ToggleShippingPromotion(ToggleShippingPromotionRequest) returns (shared.shipping.ShippingPromotion);
}
