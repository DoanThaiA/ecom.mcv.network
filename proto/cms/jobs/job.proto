syntax = "proto3";

package cms.jobs;

import "shared/common/enums.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Job error entry
message JobError {
  string                    item_id   = 1;
  string                    error     = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Job domain entity
message Job {
  string                             id             = 1;
  shared.common.JobType              type           = 2;
  shared.common.JobStatus            status         = 3;
  string                             params_hash    = 4;
  optional google.protobuf.Struct    params         = 5;
  int32                              total          = 6;
  int32                              processed      = 7;
  int32                              succeeded      = 8;
  int32                              failed         = 9;
  repeated JobError                  job_errors     = 10;
  optional string                    triggered_by   = 11;
  optional google.protobuf.Timestamp started_at     = 12;
  optional google.protobuf.Timestamp completed_at   = 13;
  optional string                    result_message = 14;
  google.protobuf.Timestamp          created_at     = 15;
  google.protobuf.Timestamp          updated_at     = 16;
}

// Job response DTO
message JobResponse {
  string                             id               = 1;
  shared.common.JobType              type             = 2;
  shared.common.JobStatus            status           = 3;
  int32                              total            = 4;
  int32                              processed        = 5;
  int32                              succeeded        = 6;
  int32                              failed           = 7;
  int32                              percent_complete = 8;
  repeated JobError                  job_errors       = 9;
  optional google.protobuf.Timestamp started_at       = 10;
  optional google.protobuf.Timestamp completed_at     = 11;
  optional string                    result_message   = 12;
  google.protobuf.Timestamp          created_at       = 13;
}

// Start job response DTO
message StartJobResponse {
  string job_id  = 1;
  string message = 2;
}

// Cancel job response DTO
message CancelJobResponse {
  string message = 1;
}

// List jobs DTO
message ListJobs {
  optional shared.common.JobType type  = 1;
  optional int32                 page  = 2;
  optional int32                 limit = 3;
}
