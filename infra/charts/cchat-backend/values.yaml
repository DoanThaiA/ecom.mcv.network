# Production values for cchat-backend
replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/mmenu-api-prod/docker/cchat-backend
  pullPolicy: Always
  tag: "prod"

# Override to create prod-specific deployment name
fullnameOverride: "cchat-backend-prod"

service:
  type: ClusterIP
  port: 3000

# Reference to production ConfigMap and Secret
configEnv: cchat-api-prod
secretEnv: cchat-api-secret

resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
