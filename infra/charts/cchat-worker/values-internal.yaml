# Internal values for cchat-worker
replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/mmenu-api-prod/docker/cchat-worker
  pullPolicy: Always
  tag: "internal-1.0.0"

# Override to create internal-specific deployment name
fullnameOverride: "cchat-worker-internal"

service:
  type: ClusterIP
  port: 3001

# Reference to internal ConfigMap and Secret
configEnv: cchat-api-internal
secretEnv: cchat-api-secret

resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
