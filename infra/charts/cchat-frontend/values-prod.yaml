# Production values for cchat-frontend
replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/mmenu-api-prod/docker/cchat-frontend
  pullPolicy: Always
  tag: "prod"

# Override to create prod-specific deployment name
fullnameOverride: "cchat-frontend-prod"

service:
  type: ClusterIP
  port: 3000

# No configEnv/secretEnv needed - env vars are baked in at build time

resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /vi/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /vi/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
