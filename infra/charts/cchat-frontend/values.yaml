# Default values for cchat-frontend
replicaCount: 1

# Override to create internal-specific deployment name
fullnameOverride: "cchat-frontend-internal"

image:
  repository: asia-southeast1-docker.pkg.dev/mmenu-api-prod/docker/cchat-frontend
  pullPolicy: Always
  tag: "internal-1.0.0"

service:
  type: ClusterIP
  port: 3000

# Reference to ConfigMap and Secret created in k8s
configEnv: cchat-api-prod
secretEnv: cchat-api-secret

resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /vi/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /vi/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
