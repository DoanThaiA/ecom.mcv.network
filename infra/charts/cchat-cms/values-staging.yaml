# Staging values for cchat-cms
replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/mmenu-api-prod/docker/cchat-cms
  pullPolicy: Always
  tag: "staging"

# Override to create staging-specific deployment name
fullnameOverride: "cchat-cms-staging"

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
