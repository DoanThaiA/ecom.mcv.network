apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "cchat-cms.fullname" . }}
  namespace: cchat
spec:
  timeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /health
    port: {{ .Values.service.port }}
  cdn:
    enabled: false
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: false
