apiVersion: v1
kind: Service
metadata:
  name: {{ include "cchat-cms.fullname" . }}
  namespace: cchat
  labels:
    {{- include "cchat-cms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cchat-cms.selectorLabels" . | nindent 4 }}
