apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cchat-api-prod
  namespace: mmenu-prod
spec:
  parentRefs:
    - name: external-http-gateway
      kind: Gateway
      sectionName: https # listener's name
  hostnames:
    - cchatapi.mmenu.io
  rules:
    # Route webhook traffic to worker
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/webhooks/nhanh
      backendRefs:
        - name: cchat-worker-prod
          namespace: cchat
          port: 3001
    - backendRefs: # match all other paths
        - name: cchat-backend-prod
          namespace: cchat
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cchat-api-internal
  namespace: mmenu-prod
spec:
  parentRefs:
    - name: external-http-gateway
      kind: Gateway
      sectionName: https # listener's name
  hostnames:
    - internalcchatapi.mmenu.io
  rules:
    # Route webhook traffic to worker
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/webhooks/nhanh
      backendRefs:
        - name: cchat-worker-internal
          namespace: cchat
          port: 3001
    - backendRefs: # match all other paths
        - name: cchat-backend-internal
          namespace: cchat
          port: 3000
