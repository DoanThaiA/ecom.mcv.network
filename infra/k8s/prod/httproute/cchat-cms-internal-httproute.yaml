apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cchat-cms-internal
  namespace: mmenu-prod
spec:
  parentRefs:
    - name: external-http-gateway
      kind: Gateway
      sectionName: https
  hostnames:
    - internalcchatcms.mmenu.io
  rules:
    - backendRefs:
        - name: cchat-cms-internal
          namespace: cchat
          port: 3000
