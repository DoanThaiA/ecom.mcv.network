apiVersion: v1
kind: ConfigMap
metadata:
  name: cchat-api-internal
  namespace: cchat
  labels:
    app: cchat-backend
    environment: internal
data:
  # Application settings
  NODE_ENV: "internal"
  APP_PORT: "3000"
  APP_NAME: "CChat E-Commerce API (Internal)"
  API_PREFIX: "api"
  APP_FALLBACK_LANGUAGE: "en"
  APP_HEADER_LANGUAGE: "x-custom-lang"

  # Domains
  WEBSITE_DOMAIN: "https://internalcchat.mmenu.io"
  CMS_DOMAIN: "https://internalcchatcms.mmenu.io"
  BACKEND_DOMAIN: "https://internalcchatapi.mmenu.io"

  # File storage
  FILE_DRIVER: "local"

  # Mail settings
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_IGNORE_TLS: "false"
  MAIL_SECURE: "false"
  MAIL_REQUIRE_TLS: "true"
  MAIL_DEFAULT_EMAIL: "noreply@mmenu.io"
  MAIL_DEFAULT_NAME: "CChat E-Commerce"
  MAIL_CLIENT_PORT: "587"
