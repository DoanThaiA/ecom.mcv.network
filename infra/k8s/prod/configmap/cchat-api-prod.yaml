apiVersion: v1
kind: ConfigMap
metadata:
  name: cchat-api-prod
  namespace: cchat
  labels:
    app: cchat-backend
    environment: prod
data:
  # Application settings
  NODE_ENV: "production"
  APP_PORT: "3000"
  APP_NAME: "CChat E-Commerce API"
  API_PREFIX: "api"
  APP_FALLBACK_LANGUAGE: "en"
  APP_HEADER_LANGUAGE: "x-custom-lang"

  # Domains
  WEBSITE_DOMAIN: "https://cchat.vn"
  CMS_DOMAIN: "https://cms.cchat.vn"
  BACKEND_DOMAIN: "https://cchatapi.mmenu.io"

  # Telegram Alert
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHANNEL_ID: ""

  # File storage
  FILE_DRIVER: "local"

  # Mail settings
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_IGNORE_TLS: "false"
  MAIL_SECURE: "false"
  MAIL_REQUIRE_TLS: "true"
  MAIL_DEFAULT_EMAIL: "noreply@mmenu.io"
  MAIL_DEFAULT_NAME: "CChat E-Commerce"
  MAIL_CLIENT_PORT: "587"
