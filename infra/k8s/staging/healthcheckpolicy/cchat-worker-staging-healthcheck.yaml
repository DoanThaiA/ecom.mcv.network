apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cchat-worker-staging-healthcheck
  namespace: cchat
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        port: 3001
        requestPath: /api/health
  targetRef:
    group: ""
    kind: Service
    name: cchat-worker-staging
