apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cchat-frontend-staging
  namespace: mmenu-staging
spec:
  parentRefs:
    - name: external-http-gateway-staging
      kind: Gateway
      sectionName: https
  hostnames:
    - stagingcchat.mmenu.io
  rules:
    - backendRefs:
        - name: cchat-frontend-staging
          namespace: cchat
          port: 3000
