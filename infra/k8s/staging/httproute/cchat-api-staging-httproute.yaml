apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cchat-api-staging
  namespace: mmenu-prod
spec:
  parentRefs:
    - name: external-http-gateway
      kind: Gateway
      sectionName: https
  hostnames:
    - stagingcchatapi.mmenu.io
  rules:
    # Route webhook traffic to worker
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/webhooks/nhanh
      backendRefs:
        - name: cchat-worker-staging
          namespace: cchat
          port: 3001
    # All other traffic to API server
    - backendRefs:
        - name: cchat-backend-staging
          namespace: cchat
          port: 3000
