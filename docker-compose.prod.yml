services:
  mongo:
    image: mongo:7.0.5
    restart: always
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    restart: always
    volumes: [redis-data:/data]

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env.prod
    depends_on: [mongo, redis]
    ports: ["127.0.0.1:5100:3000"]
    volumes: [uploads:/usr/src/app/files]

  worker:
    build: { context: ./backend, dockerfile: worker.Dockerfile }
    restart: always
    env_file: ./backend/.env.prod
    depends_on: [mongo, redis]
    # Nhanh.vn webhook endpoint: nginx forwards /api/v1/webhooks/nhanh here
    ports: ["127.0.0.1:5103:3001"]

  frontend:
    build: ./frontend
    restart: always
    ports: ["127.0.0.1:5101:3000"]

  cms:
    build: ./cms
    restart: always
    ports: ["127.0.0.1:5102:3000"]

volumes:
  mongo-data:
  redis-data:
  uploads:
