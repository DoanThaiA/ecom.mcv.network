services:
  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  mongo:
    image: mongo:7.0.5
    restart: always
    volumes:
      - boilerplate-mongo-db:/data/db
    ports:
      - 27017:27017

