syntax = "proto3";

import "common.proto";

package merchant;

message MerchantsBrand {
  string brand_id   = 1;
  string brand_code = 2;
  string brand_name = 3;
}

message ThirdPartyMerchantInfos {
  common.ThirdPartyName name       = 1;
  string                merchantId = 2;
}

message Merchant {
  string                           id                      = 1;
  string                           code                    = 2;
  string                           name                    = 3;
  MerchantsBrand                   brand                   = 4;
  repeated ThirdPartyMerchantInfos thirdPartyMerchantInfos = 5;
}

message CreateOrUpdateMerchantRequest {
  string   merchant_id = 1;
  Merchant merchant    = 2;
}

message CreateOrUpdateMerchantResponse {
  int32    code             = 1;
  string   message          = 2;
  Merchant updated_merchant = 3;
}

message GetMerchantByIdRequest {
  string merchant_id = 1;
}

message GetMerchantByIdResponse {
  int32    code     = 1;
  string   message  = 2;
  Merchant merchant = 3;
}

message GetMerchantsByBrandIdRequest {
  string brand_id = 1;
}

message GetMerchantsByBrandIdResponse {
  int32             code      = 1;
  string            message   = 2;
  repeated Merchant merchants = 3;
}

message DeleteMerchantByIdRequest {
  string merchant_id = 1;
}

message DeleteMerchantByIdResponse {
  int32  code    = 1;
  string message = 2;
}

service MerchantRoutes {
  rpc createOrUpdateMerchant(CreateOrUpdateMerchantRequest) returns (CreateOrUpdateMerchantResponse) {}
  rpc getMerchantById(GetMerchantByIdRequest) returns (GetMerchantByIdResponse) {}
  rpc getMerchantsByBrandId(GetMerchantsByBrandIdRequest) returns (GetMerchantsByBrandIdResponse) {}
  rpc deleteMerchantById(DeleteMerchantByIdRequest) returns (DeleteMerchantByIdResponse) {}
}
